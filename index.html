<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>英语跟读学习</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #161618;
    --card2: #1c1c1f;
    --text: #e4e4e6;
    --sub: #8e8e93;
    --accent: #4da6ff;
    --accent2: #3385d6;
    --warn: #f5a623;
    --danger: #e05555;
    --border: #262629;
    --highlight: rgba(77,166,255,0.2);
    --word-hl: rgba(77,166,255,0.45);
    --green: #34c759;
    --cn-color: #a0a0a8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    text-align: center;
    padding: 6px 0 4px;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header p { font-size: 10px; color: var(--sub); margin-top: 1px; }

  .input-section { flex-shrink: 0; margin-bottom: 6px; }
  textarea {
    width: 100%;
    height: 80px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    padding: 8px 10px;
    resize: none;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #444; font-size: 12px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 3px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px 9px;
    font-size: 11px;
    color: var(--sub);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    user-select: none;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip:active { transform: scale(0.96); }
  .chip input[type=range] {
    -webkit-appearance: none;
    width: 45px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin: 0 2px;
  }
  .chip input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
  }
  .chip select {
    background: transparent; border: none; color: var(--sub); font-size: 11px;
    font-family: inherit; outline: none;
  }

  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); opacity: 0.85; }
  .btn-play { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; flex: 2.5; }
  .btn-sm { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 12px; }
  .btn-sm.stop { color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.3; pointer-events: none; }

  .progress-wrap {
    height: 2px;
    background: var(--border);
    margin: 6px 0;
    border-radius: 1px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
    border-radius: 1px;
  }

  .tab-row {
    display: flex;
    gap: 0;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 7px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .display-area {
    flex: 1;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 120px;
  }
  .display-area .empty {
    color: #333;
    text-align: center;
    padding-top: 40px;
    font-size: 12px;
    line-height: 1.8;
  }

  .sent-block {
    margin-bottom: 10px;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.25s;
    cursor: pointer;
  }
  .sent-block.active-block {
    border-color: var(--accent);
    background: rgba(77,166,255,0.06);
  }
  .sent-block .text-line { font-size: 15px; line-height: 1.8; font-weight: 500; }
  .sent-block .cn-line { font-size: 12px; color: var(--cn-color); line-height: 1.5; margin-top: 2px; display: none; }
  .sent-block .cn-line.show { display: block; }
  .sent-block .lang-tag {
    display: inline-block;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 5px;
    margin-right: 5px;
    vertical-align: middle;
    font-weight: 600;
  }
  .sent-block .lang-tag.en { background: rgba(77,166,255,0.2); color: var(--accent); }
  .sent-block .lang-tag.cn { background: rgba(245,166,35,0.2); color: var(--warn); }

  .word { display: inline; cursor: pointer; padding: 1px 2px; border-radius: 3px; transition: background 0.12s; }
  .word.active-word { background: var(--word-hl); }

  /* 生词本 */
  .vocab-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: var(--card2);
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    gap: 10px;
  }
  .vocab-item .v-word { font-weight: 700; color: var(--accent); min-width: 60px; font-size: 15px; }
  .vocab-item .v-phonetic { color: var(--sub); font-size: 11px; min-width: 60px; }
  .vocab-item .v-cn { color: var(--cn-color); font-size: 12px; flex: 1; }
  .vocab-item .v-btns { display: flex; gap: 4px; }
  .vocab-item .v-btn {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .vocab-item .v-btn.del { color: var(--danger); border-color: transparent; }
  .vocab-clear { text-align: center; padding: 10px; font-size: 11px; color: var(--sub); cursor: pointer; }
  .vocab-actions { display: flex; gap: 6px; padding: 8px 0; justify-content: center; }
  .vocab-actions .v-act {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
  }

  /* 日记 */
  .diary-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 8px;
    font-size: 11px;
    color: var(--sub);
  }
  .diary-header select {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .diary-entry {
    margin-bottom: 14px;
    padding: 10px;
    background: var(--card2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .diary-entry .diary-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .diary-entry .diary-content {
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .diary-entry .diary-meta {
    font-size: 10px;
    color: var(--sub);
    margin-top: 4px;
  }
  .diary-copy-btn {
    display: block;
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .diary-copy-btn:active { background: rgba(77,166,255,0.1); }
  .diary-copy-msg { text-align: center; font-size: 11px; color: var(--green); margin-top: 4px; display: none; }

  /* 弹窗 */
  .popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    z-index: 100;
    min-width: 260px;
    max-width: 92vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: none;
  }
  .popup.show { display: block; }
  .popup .word-big { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .popup .syllables { font-size: 13px; color: var(--warn); margin-bottom: 2px; }
  .popup .word-cn { font-size: 13px; color: var(--cn-color); margin-bottom: 2px; }
  .popup .phonetic { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
  .popup .popup-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .popup .popup-btn {
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .popup .popup-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .popup .popup-btn.syllable-btn { background: rgba(245,166,35,0.15); border-color: var(--warn); color: var(--warn); font-size: 10px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
  .overlay.show { display: block; }

  .status-bar {
    text-align: center;
    font-size: 10px;
    color: var(--sub);
    padding: 4px 0;
    flex-shrink: 0;
    min-height: 16px;
  }
  .status-bar.playing { color: var(--accent); }
  footer { text-align: center; font-size: 9px; color: #2a2a2a; padding: 2px 0 0; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>📖 英语跟读学习</h1>
  <p>中英分离语速 · 生词本 · 学习日记</p>
</header>

<div class="input-section">
  <textarea id="textInput" placeholder="粘贴英文/中英混合/学习卡片内容…&#10;&#10;支持格式：&#10;· 普通英文段落&#10;· 中英对照（自动识别语言）&#10;· 学习卡片内容（直接从页面复制粘贴）"></textarea>
</div>

<div class="toolbar">
  <div class="chip">EN🐢<input type="range" id="enSpeed" min="0.35" max="1.0" step="0.05" value="0.5"><span id="enSpeedVal">0.50x</span></div>
  <div class="chip">CN📻<input type="range" id="cnSpeed" min="0.7" max="1.3" step="0.05" value="1.0"><span id="cnSpeedVal">1.00x</span></div>
  <div class="chip">⏱️<select id="pauseSelect">
    <option value="0.5">停0.5s</option>
    <option value="1" selected>停1s</option>
    <option value="1.5">停1.5s</option>
    <option value="2">停2s</option>
    <option value="3">停3s</option>
  </select></div>
  <div class="chip" id="chipShowCN" onclick="toggleShowCN()">🇨🇳翻译</div>
  <div class="chip" id="chipLoop" onclick="toggleLoop()">🔁循环</div>
</div>

<div class="btn-row">
  <button class="btn btn-play" id="btnPlay" onclick="startReading()">▶ 开始朗读</button>
  <button class="btn btn-sm" id="btnPause" onclick="togglePause()" disabled>⏯</button>
  <button class="btn btn-sm stop" id="btnStop" onclick="stopReading()" disabled>⏹</button>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="tab-row">
  <button class="tab-btn active" id="tabText" onclick="switchTab('text')">📄 文本</button>
  <button class="tab-btn" id="tabVocab" onclick="switchTab('vocab')">📝 生词本<span id="vocabCount"></span></button>
  <button class="tab-btn" id="tabDiary" onclick="switchTab('diary')">📅 日记</button>
</div>

<div class="display-area" id="displayArea">
  <div class="empty">👆 粘贴文字，自动拆分句子<br>中英文混合也能逐句朗读</div>
</div>

<div class="status-bar" id="statusBar">就绪</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div class="word-big" id="popupWord"></div>
  <div class="syllables" id="popupSyllables"></div>
  <div class="word-cn" id="popupWordCN"></div>
  <div class="phonetic" id="popupPhonetic"></div>
  <div class="popup-btns">
    <button class="popup-btn primary" onclick="speakWord3Times()">🔊×3</button>
    <button class="popup-btn syllable-btn" onclick="speakSyllables()">🔤 音节</button>
    <button class="popup-btn" onclick="speakSentenceFromWord()">📖 整句</button>
    <button class="popup-btn" onclick="closePopup()">✕</button>
  </div>
</div>

<footer>
  💾 离线保存：Safari 打开 → 分享 ⎋ → 存储到文件 → 以后永远能用<br>
  推荐 Safari 打开 · 系统语音引擎
</footer>

<script>
// ========== 全局 ==========
const synth = window.speechSynthesis;
let sentences = [];
let currentIdx = -1;
let isPlaying = false;
let isPaused = false;
let loopSingle = false;
let showCN = true;
let selectedEnVoice = null;
let selectedCNVoice = null;
let popupWordText = '';
let popupSentenceIdx = -1;
let vocabList = [];
let diaryData = {};
let currentTab = 'text';
let speakingWord3 = false;
let renderVersion = 0; // 防止过期渲染

// DOM
const textInput = document.getElementById('textInput');
const displayArea = document.getElementById('displayArea');
const btnPlay = document.getElementById('btnPlay');
const btnPause = document.getElementById('btnPause');
const btnStop = document.getElementById('btnStop');
const statusBar = document.getElementById('statusBar');
const enSpeedSlider = document.getElementById('enSpeed');
const cnSpeedSlider = document.getElementById('cnSpeed');
const enSpeedVal = document.getElementById('enSpeedVal');
const cnSpeedVal = document.getElementById('cnSpeedVal');
const pauseSelect = document.getElementById('pauseSelect');
const chipShowCN = document.getElementById('chipShowCN');
const chipLoop = document.getElementById('chipLoop');
const progressBar = document.getElementById('progressBar');
const popup = document.getElementById('popup');
const overlay = document.getElementById('overlay');
const vocabCount = document.getElementById('vocabCount');

// ========== 语音 ==========
function loadVoices() {
  const voices = synth.getVoices();
  if (voices.length === 0) {
    // iOS 本地文件可能需要先触发一次语音才能加载
    statusBar.textContent = '正在初始化语音…';
    return;
  }
  const enPref = ['Samantha', 'Alex', 'Karen', 'Daniel', 'Google US English', 'Microsoft David', 'Microsoft Zira'];
  for (const name of enPref) {
    const v = voices.find(vo => vo.name === name && vo.lang.startsWith('en'));
    if (v) { selectedEnVoice = v; break; }
  }
  if (!selectedEnVoice) selectedEnVoice = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en')) || voices[0];
  const cnPref = ['Tingting', 'Sin-ji', 'Mei-Jia', 'Microsoft Hanhan'];
  for (const name of cnPref) {
    const v = voices.find(vo => vo.name.includes(name) && vo.lang.startsWith('zh'));
    if (v) { selectedCNVoice = v; break; }
  }
  if (!selectedCNVoice) selectedCNVoice = voices.find(v => v.lang.startsWith('zh-CN')) || voices.find(v => v.lang.startsWith('zh')) || voices[0];
  statusBar.textContent = `EN: ${selectedEnVoice?.name||'?'} | CN: ${selectedCNVoice?.name||'?'}`;
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

// iOS 语音引擎激活：需要用户交互后才能播放
let voiceActivated = false;
function activateVoice() {
  if (voiceActivated) return;
  voiceActivated = true;
  // 空语音触发 iOS 语音引擎
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  synth.speak(u);
  // 重新加载语音列表
  setTimeout(() => loadVoices(), 500);
}
document.addEventListener('touchstart', activateVoice, { once: true });
document.addEventListener('click', activateVoice, { once: true });

enSpeedSlider.addEventListener('input', () => enSpeedVal.textContent = parseFloat(enSpeedSlider.value).toFixed(2)+'x');
cnSpeedSlider.addEventListener('input', () => cnSpeedVal.textContent = parseFloat(cnSpeedSlider.value).toFixed(2)+'x');

function toggleShowCN() { showCN = !showCN; chipShowCN.classList.toggle('active', showCN); updateCNVisibility(); }
function toggleLoop() { loopSingle = !loopSingle; chipLoop.classList.toggle('active', loopSingle); }
function updateCNVisibility() {
  document.querySelectorAll('.cn-line').forEach(el => el.classList.toggle('show', showCN));
}
chipShowCN.classList.add('active');

// ========== 音节 ==========
function splitSyllables(word) {
  const w = word.toLowerCase();
  const parts = [];
  let i = 0;
  while (i < w.length) {
    if ('aeiouy'.includes(w[i])) {
      let j = i + 1;
      while (j < w.length && 'aeiouy'.includes(w[j])) j++;
      if (j < w.length && !'aeiouy'.includes(w[j]) && (j+1 >= w.length || 'aeiouy'.includes(w[j+1]))) j++;
      parts.push(w.slice(i, j));
      i = j;
    } else {
      let j = i + 1;
      while (j < w.length && !'aeiouy'.includes(w[j])) j++;
      parts.push(w.slice(i, j));
      i = j;
    }
  }
  return parts.length > 1 ? parts.join('·') : w;
}

// ========== 检测语言 ==========
function detectLang(text) {
  const cn = (text.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
  const en = (text.match(/[a-zA-Z]/g) || []).length;
  return cn > en ? 'zh' : 'en';
}

// ========== 翻译 ==========
async function translateText(text) {
  // 策略1：用内置词典逐词翻译（离线可用）
  const words = text.split(/\s+/);
  const cnWords = words.map(w => {
    const clean = w.replace(/[.,!?;:'"()\[\]{}]/g, '').toLowerCase();
    return getWordCN(clean);
  });
  const hasTranslation = cnWords.some(w => w !== '');
  if (hasTranslation) {
    // 至少有部分词能翻译，拼接结果
    return cnWords.filter(w => w !== '').join('；');
  }

  // 策略2：调用在线 API（需要网络）
  try {
    const resp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-CN`);
    const data = await resp.json();
    const result = data.responseData?.translatedText || '';
    if (result.includes('MYMEMORY') || result.includes('WARNING') || result.includes('TRANSLATION') || result.includes('LIMIT')) return '';
    if (result !== text) return result;
  } catch(e) {}
  return '';
}

// ========== 解析 ==========
function parseText(text) {
  // 清理多余空行和序号
  let cleaned = text
    .replace(/^\d+\s*$/gm, '')       // 去掉纯数字行（序号）
    .replace(/^\d+\.\s*/gm, '')      // 去掉 "1. " 开头
    .replace(/\n{3,}/g, '\n\n');      // 合并多余空行

  const raw = cleaned
    .replace(/([.!?])\s+/g, '$1\n')  // 英文句号换行
    .replace(/([。！？])\s*/g, '$1\n') // 中文句号换行
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);

  // 识别学习卡片格式：中英交替的行合并为一句
  const merged = [];
  for (let i = 0; i < raw.length; i++) {
    const s = raw[i];
    const lang = detectLang(s);
    const prevLang = merged.length > 0 ? detectLang(merged[merged.length - 1]) : null;

    // 如果当前是中文，且前一句是英文，合并为中英对照
    if (lang === 'zh' && prevLang === 'en' && merged.length > 0) {
      // 不合并，保持中文独立（朗读时会用中文语音）
      merged.push(s);
    }
    // 如果当前是英文，且前一句也是英文但很短，合并
    else if (lang === 'en' && prevLang === 'en' && merged.length > 0 && merged[merged.length-1].split(/\s+/).length < 4) {
      merged[merged.length - 1] += ' ' + s;
    }
    // 中文短句合并
    else if (lang === 'zh' && prevLang === 'zh' && merged.length > 0 && merged[merged.length-1].length < 6) {
      merged[merged.length - 1] += s;
    }
    else {
      merged.push(s);
    }
  }
  return merged;
}

// ========== 存储 ==========
function loadVocab() {
  try { vocabList = JSON.parse(localStorage.getItem('eng_vocab')||'[]'); } catch(e) { vocabList = []; }
  let needSave = false;
  vocabList = vocabList.filter(v => {
    // 清除被 API 限流污染的翻译
    if (v.cn && (v.cn.includes('MYMEMORY') || v.cn.includes('WARNING') || v.cn.includes('TRANSLATION'))) {
      v.cn = '';
      needSave = true;
    }
    return true;
  });
  vocabList.forEach(v => {
    if (!v.cn || v.cn === '') { v.cn = getWordCN(v.word); needSave = true; }
    if (!v.phonetic) { v.phonetic = getPhonetic(v.word); needSave = true; }
    if (!v.syllables) { v.syllables = splitSyllables(v.word); needSave = true; }
  });
  if (needSave) saveVocab();
  updateVocabCount();
}
function saveVocab() { localStorage.setItem('eng_vocab', JSON.stringify(vocabList)); updateVocabCount(); }
function addVocab(word) {
  word = word.toLowerCase();
  if (vocabList.find(v => v.word === word)) return;
  vocabList.unshift({ word, phonetic: getPhonetic(word), cn: getWordCN(word), syllables: splitSyllables(word), time: Date.now() });
  if (vocabList.length > 300) vocabList = vocabList.slice(0, 300);
  saveVocab();
}
function removeVocab(word) { vocabList = vocabList.filter(v => v.word !== word); saveVocab(); if (currentTab==='vocab') renderVocab(); }
function clearVocab() { if (vocabList.length===0) return; if (confirm('清空所有生词？')) { vocabList=[]; saveVocab(); if (currentTab==='vocab') renderVocab(); } }
function updateVocabCount() { vocabCount.textContent = vocabList.length>0 ? `(${vocabList.length})` : ''; }

// ========== 日记 ==========
function loadDiary() { try { diaryData = JSON.parse(localStorage.getItem('eng_diary')||'{}'); } catch(e) { diaryData = {}; } }
function saveDiary() { localStorage.setItem('eng_diary', JSON.stringify(diaryData)); }

function addDiaryEntry(content, wordCount) {
  const today = new Date().toISOString().slice(0, 10);
  if (!diaryData[today]) diaryData[today] = { entries: [], words: [] };
  diaryData[today].entries.push({ time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}), content, wordCount });
  saveDiary();
}

function getDiaryDates() {
  return Object.keys(diaryData).sort().reverse();
}

function renderDiary(dateStr) {
  if (!dateStr) {
    const dates = getDiaryDates();
    if (dates.length === 0) {
      displayArea.innerHTML = '<div class="empty">还没有学习记录<br>开始朗读后会自动记录</div>';
      return;
    }
    dateStr = dates[0];
  }

  const entry = diaryData[dateStr];
  if (!entry) {
    displayArea.innerHTML = '<div class="empty">当天没有学习记录</div>';
    return;
  }

  const dates = getDiaryDates();
  const dateOptions = dates.map(d => `<option value="${d}" ${d===dateStr?'selected':''}>${d}</option>`).join('');

  const entriesHtml = entry.entries.map((e, i) => `
    <div class="diary-entry">
      <div class="diary-date">🕐 ${e.time}</div>
      <div class="diary-content">${escapeHtml(e.content)}</div>
      <div class="diary-meta">${e.wordCount} 个单词</div>
    </div>
  `).join('');

  const totalWords = entry.entries.reduce((s, e) => s + (e.wordCount||0), 0);
  const allContent = entry.entries.map(e => e.content).join('\n\n---\n\n');

  displayArea.innerHTML = `
    <div class="diary-header">
      <span>📅 学习日记</span>
      <select onchange="renderDiary(this.value)">${dateOptions}</select>
    </div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:8px;">
      共 ${entry.entries.length} 次学习 · ${totalWords} 个生词
    </div>
    ${entriesHtml}
    <button class="diary-copy-btn" onclick="copyDiaryDay('${dateStr}')">📋 一键复制当日内容（粘贴到备忘录）</button>
    <div class="diary-copy-msg" id="diaryCopyMsg">✅ 已复制！去备忘录粘贴即可</div>
  `;
}

function copyDiaryDay(dateStr) {
  const entry = diaryData[dateStr];
  if (!entry) return;

  const lines = [`📅 英语学习日记 — ${dateStr}`, '', `共 ${entry.entries.length} 次学习 · ${entry.entries.reduce((s,e)=>s+(e.wordCount||0),0)} 个生词`, ''];

  entry.entries.forEach((e, i) => {
    lines.push(`🕐 ${e.time}`);
    lines.push(e.content);
    if (i < entry.entries.length - 1) lines.push('');
  });

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('diaryCopyMsg');
    if (msg) { msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 2500); }
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

// ========== 渲染 ==========
async function renderDisplay() {
  const text = textInput.value.trim();
  if (!text) {
    displayArea.innerHTML = '<div class="empty">👆 粘贴文字，自动拆分句子<br>中英文混合也能逐句朗读</div>';
    sentences = [];
    progressBar.style.width = '0%';
    return;
  }

  const myVersion = ++renderVersion;
  const rawSentences = parseText(text);
  statusBar.textContent = '翻译中…';

  const cnResults = await Promise.all(rawSentences.map(s => detectLang(s)==='en' ? translateText(s) : Promise.resolve('')));
  // 检查是否被新渲染覆盖
  if (myVersion !== renderVersion) return;

  sentences = rawSentences.map((text, i) => ({ text, lang: detectLang(text), cn: cnResults[i] || '' }));

  if (currentTab === 'text') renderSentencesHTML();
  statusBar.textContent = `共 ${sentences.length} 句 · 就绪`;
  statusBar.className = 'status-bar';
}

function renderSentencesHTML() {
  displayArea.innerHTML = sentences.map((s, si) => {
    const isEn = s.lang === 'en';
    const tag = isEn ? '<span class="lang-tag en">EN</span>' : '<span class="lang-tag cn">中</span>';
    let textHtml;
    if (isEn) {
      const words = s.text.split(/(\s+)/);
      textHtml = words.map((w, wi) => {
        const trimmed = w.trim();
        if (!trimmed) return w;
        const clean = trimmed.replace(/[.,!?;:'"()\[\]{}]$/, '');
        return `<span class="word" data-si="${si}" data-wi="${wi}" data-word="${escapeHtml(clean)}">${w}</span>`;
      }).join('');
    } else {
      textHtml = escapeHtml(s.text);
    }
    return `<div class="sent-block" data-si="${si}" onclick="clickSentence(${si})">
      <div class="text-line">${tag}${textHtml}</div>
      <div class="cn-line ${showCN?'show':''}">${s.cn||''}</div>
    </div>`;
  }).join('');

  bindWordClicks();
}

function bindWordClicks() {
  displayArea.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const word = el.dataset.word;
      const si = parseInt(el.dataset.si);
      if (word) openWordPopup(word, si);
    });
  });
}

function renderVocab() {
  if (vocabList.length === 0) {
    displayArea.innerHTML = '<div class="empty">还没有收藏生词<br>点英文单词会自动添加</div>';
    return;
  }
  displayArea.innerHTML = `
    <div class="vocab-actions">
      <button class="v-act" onclick="playAllVocab()">🔊 全部朗读</button>
      <button class="v-act" onclick="clearVocab()">🗑 清空</button>
    </div>
    ${vocabList.map(v => `
    <div class="vocab-item">
      <span class="v-word">${escapeHtml(v.word)}</span>
      <span class="v-phonetic">${v.phonetic||''}</span>
      <span class="v-cn">${escapeHtml(v.cn || getWordCN(v.word) || '—')}</span>
      <div class="v-btns">
        <button class="v-btn" onclick="event.stopPropagation();playVocabWord('${escapeHtml(v.word)}')">🔊×3</button>
        <button class="v-btn" onclick="event.stopPropagation();playVocabSyllables('${escapeHtml(v.word)}','${escapeHtml(v.syllables||'')}')">🔤</button>
        <button class="v-btn del" onclick="event.stopPropagation();removeVocab('${escapeHtml(v.word)}')">✕</button>
      </div>
    </div>`).join('')}
  `;
}

function playAllVocab() {
  if (vocabList.length === 0) return;
  synth.cancel();
  let i = 0;
  function next() {
    if (i >= vocabList.length) return;
    const u = new SpeechSynthesisUtterance(vocabList[i].word);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.45;
    u.onend = () => { i++; setTimeout(next, 400); };
    synth.speak(u);
  }
  next();
}

function playVocabWord(word) {
  synth.cancel();
  const rates = [0.45, 0.3, 0.5];
  let i = 0;
  function next() {
    if (i >= rates.length) return;
    const u = new SpeechSynthesisUtterance(word);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = rates[i];
    u.onend = () => { i++; setTimeout(next, 350); };
    synth.speak(u);
  }
  next();
}

function playVocabSyllables(word, syllables) {
  synth.cancel();
  const parts = (syllables || splitSyllables(word)).split('·');
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const u = new SpeechSynthesisUtterance(parts[i]);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.35;
    u.onend = () => { i++; setTimeout(next, 250); };
    synth.speak(u);
  }
  next();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabText').classList.toggle('active', tab==='text');
  document.getElementById('tabVocab').classList.toggle('active', tab==='vocab');
  document.getElementById('tabDiary').classList.toggle('active', tab==='diary');
  if (tab === 'text') {
    if (sentences.length > 0) renderSentencesHTML();
  } else if (tab === 'vocab') {
    renderVocab();
  } else if (tab === 'diary') {
    renderDiary();
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== 点击句子 ==========
function clickSentence(si) {
  if (isPlaying || speakingWord3) return;
  synth.cancel();
  currentIdx = si;
  setButtons(true, false);
  updateProgress();
  readNext();
}

// ========== 朗读控制 ==========
function setButtons(playing, paused) {
  btnPlay.disabled = playing;
  btnPause.disabled = !playing;
  btnStop.disabled = !playing;
  btnPause.textContent = paused ? '▶' : '⏯';
  isPlaying = playing;
  isPaused = paused;
}

function highlightBlock(idx) {
  document.querySelectorAll('.sent-block').forEach(el => el.classList.remove('active-block'));
  const el = document.querySelector(`.sent-block[data-si="${idx}"]`);
  if (el) { el.classList.add('active-block'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}

function highlightWord(si, wordIdx) {
  document.querySelectorAll('.word').forEach(el => el.classList.remove('active-word'));
  const block = document.querySelector(`.sent-block[data-si="${si}"]`);
  if (!block) return;
  const words = block.querySelectorAll('.word');
  let realIdx = 0;
  for (let i=0; i<=wordIdx && i<words.length; i++) { if (words[i].dataset.word) realIdx = i; }
  if (words[realIdx]) words[realIdx].classList.add('active-word');
}

function updateProgress() {
  if (sentences.length===0) { progressBar.style.width='0%'; return; }
  progressBar.style.width = Math.round((currentIdx/sentences.length)*100)+'%';
}

function getPauseSec() { return parseFloat(pauseSelect.value); }

function speakSentence(sent) {
  const u = new SpeechSynthesisUtterance(sent.text);
  if (sent.lang==='en' && selectedEnVoice) u.voice = selectedEnVoice;
  else if (sent.lang==='zh' && selectedCNVoice) u.voice = selectedCNVoice;
  u.rate = sent.lang==='en' ? parseFloat(enSpeedSlider.value) : parseFloat(cnSpeedSlider.value);
  u.pitch = 1;
  u.volume = 1;

  if (sent.lang==='en') {
    const words = sent.text.split(/\s+/);
    u.onboundary = (e) => {
      if (e.charIndex !== undefined) {
        let charCount=0, wi=0;
        for (const w of words) { if (charCount>=e.charIndex) break; charCount+=w.length+1; wi++; }
        highlightWord(currentIdx, Math.min(wi, words.length-1));
      }
    };
  }

  u.onend = () => {
    highlightWord(currentIdx, -1);
    if (loopSingle) {
      setTimeout(() => speakSentence(sent), getPauseSec()*1000);
    } else {
      currentIdx++;
      if (currentIdx < sentences.length) {
        setTimeout(() => readNext(), getPauseSec()*1000);
      } else {
        finishReading();
      }
    }
  };
  u.onerror = (e) => {
    if (e.error==='canceled'||e.error==='interrupted') return;
    highlightWord(currentIdx, -1);
    if (!loopSingle) { currentIdx++; if (currentIdx<sentences.length) setTimeout(()=>readNext(),400); else finishReading(); }
  };
  synth.speak(u);
}

function readNext() {
  if (currentIdx>=sentences.length) { finishReading(); return; }
  highlightBlock(currentIdx);
  updateProgress();
  const sent = sentences[currentIdx];
  statusBar.textContent = `朗读 ${currentIdx+1}/${sentences.length} (${sent.lang==='en'?'EN':'中'})`;
  statusBar.className = 'status-bar playing';
  speakSentence(sent);
}

function startReading() {
  const text = textInput.value.trim();
  if (!text) { statusBar.textContent='请先粘贴内容'; return; }

  async function prepAndStart() {
    // 激活 iOS 语音引擎
    activateVoice();
    await new Promise(r => setTimeout(r, 300));
    
    await renderDisplay();
    if (sentences.length === 0) {
      statusBar.textContent = '内容为空或翻译失败';
      return;
    }
    switchTab('text');
    synth.cancel();
    currentIdx = 0;
    setButtons(true, false);
    updateProgress();

    // 记录日记
    const enCount = sentences.filter(s => s.lang==='en').length;
    const preview = sentences.slice(0, 3).map(s => s.text).join(' ');
    const snippet = preview.length > 80 ? preview.slice(0, 80) + '...' : preview;
    addDiaryEntry(snippet + (sentences.length > 3 ? ` …等${sentences.length}句` : ''), enCount);

    readNext();
  }
  prepAndStart();
}

function togglePause() {
  if (synth.speaking && !isPaused) { synth.cancel(); setButtons(true,true); statusBar.textContent='已暂停'; statusBar.className='status-bar'; }
  else if (isPaused) { setButtons(true,false); readNext(); }
}
function stopReading() {
  synth.cancel(); currentIdx=-1; setButtons(false,false); statusBar.textContent='已停止'; statusBar.className='status-bar';
  progressBar.style.width='0%';
  document.querySelectorAll('.sent-block').forEach(el=>el.classList.remove('active-block'));
  document.querySelectorAll('.word').forEach(el=>el.classList.remove('active-word'));
}
function finishReading() {
  currentIdx=-1; setButtons(false,false); statusBar.textContent='朗读完成 ✓'; statusBar.className='status-bar';
  progressBar.style.width='100%';
  document.querySelectorAll('.sent-block').forEach(el=>el.classList.remove('active-block'));
  document.querySelectorAll('.word').forEach(el=>el.classList.remove('active-word'));
}

// ========== 单词弹窗 ==========
function openWordPopup(word, si) {
  popupWordText = word;
  popupSentenceIdx = si;
  document.getElementById('popupWord').textContent = word;
  document.getElementById('popupSyllables').textContent = splitSyllables(word);
  const cnText = getWordCN(word);
  document.getElementById('popupWordCN').textContent = cnText || '—';
  document.getElementById('popupPhonetic').textContent = getPhonetic(word);
  popup.classList.add('show');
  overlay.classList.add('show');
  addVocab(word);
  // 如果内置词典没有，尝试在线查词（可能离线不可用）
  if (!cnText) {
    lookupWord(word).then(cn => {
      if (cn) {
        document.getElementById('popupWordCN').textContent = cn;
        const v = vocabList.find(v => v.word === word);
        if (v && !v.cn) { v.cn = cn; saveVocab(); }
      }
    });
  }
}

async function lookupWord(word) {
  try {
    const resp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`);
    const data = await resp.json();
    const result = data.responseData?.translatedText || '';
    if (result.includes('MYMEMORY') || result.includes('WARNING') || result.includes('TRANSLATION') || result.includes('LIMIT')) return '';
    return result;
  } catch(e) {}
  return '';
}
function closePopup() { popup.classList.remove('show'); overlay.classList.remove('show'); speakingWord3 = false; synth.cancel(); }

function speakWord3Times() {
  if (!popupWordText) return;
  synth.cancel();
  speakingWord3 = true;
  const w = popupWordText;
  function r1() {
    const u = new SpeechSynthesisUtterance(w);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.45;
    u.onend = () => setTimeout(r2, 350);
    synth.speak(u);
  }
  function r2() {
    const u = new SpeechSynthesisUtterance(w);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.3;
    u.onend = () => setTimeout(r3, 400);
    synth.speak(u);
  }
  function r3() {
    const u = new SpeechSynthesisUtterance(w);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.5;
    u.onend = () => { speakingWord3 = false; };
    synth.speak(u);
  }
  r1();
}

function speakSyllables() {
  if (!popupWordText) return;
  synth.cancel();
  const parts = splitSyllables(popupWordText).split('·');
  let i = 0;
  function next() {
    if (i >= parts.length) { speakingWord3 = false; return; }
    const u = new SpeechSynthesisUtterance(parts[i]);
    if (selectedEnVoice) u.voice = selectedEnVoice;
    u.rate = 0.35;
    u.onend = () => { i++; setTimeout(next, 250); };
    synth.speak(u);
  }
  speakingWord3 = true;
  next();
}

function speakSentenceFromWord() {
  if (popupSentenceIdx<0 || !sentences[popupSentenceIdx]) return;
  closePopup();
  synth.cancel();
  speakSentence(sentences[popupSentenceIdx]);
}
