<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0F1A">
<meta name="apple-mobile-web-app-title" content="旅行英语">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238B5CF6'/><stop offset='100%25' stop-color='%2306B6D4'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='%230D0F1A'/><text x='90' y='125' font-size='60' text-anchor='middle' fill='url(%23g)' font-family='sans-serif' font-weight='bold'>✈️</text></svg>">
<title>旅行英语学习</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== 深色 SaaS 极光设计系统 ===== */
:root{
  --bg:#0D0F1A; --bg2:#161B22; --card:rgba(255,255,255,.03); --card-hover:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12); --border-accent:#30363D;
  --blue:#4A7BF7; --blue-light:#5B8BF7; --purple:#8B5CF6; --cyan:#06B6D4; --cyan-light:#22D3EE;
  --green:#22C55E; --red:#EF4444; --yellow:#FBBF24; --orange:#F97316;
  --text:#F0F6FC; --text2:#94A3B8; --text3:#64748B;
  --radius:16px; --radius-sm:12px; --radius-pill:999px;
  --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --grad-aurora:linear-gradient(135deg,#8B5CF6 0%,#06B6D4 100%);
  --grad-blue:linear-gradient(135deg,#5B8BF7 0%,#4A7BF7 100%);
  --grad-cyan:linear-gradient(135deg,#22D3EE 0%,#06B6D4 100%);
  --grad-text:linear-gradient(135deg,#60A5FA 0%,#22D3EE 100%);
  --glow-blue:0 0 20px rgba(74,123,247,.3);
  --glow-aurora:0 4px 20px rgba(139,92,246,.25);
  --shadow-card:0 4px 24px rgba(0,0,0,.3);
  --shadow-card-hover:0 8px 32px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none;color:inherit;font-weight:700}
input,textarea,select{font-family:inherit;font-size:16px;outline:none;font-weight:500}
a{color:var(--blue);text-decoration:none;font-weight:600}

/* 隐藏 CodeSandbox 等外部按钮 */
body > div[class*="sandbox"], body > button[class*="sandbox"],
body > a[class*="sandbox"], .sandbox-btn, .open-sandbox,
[class*="OpenSandbox"], [class*="open-sandbox"],
#csb-devtools, .csb-devtools{display:none!important}

/* ===== 页面容器 ===== */
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  background:
    radial-gradient(ellipse 70% 40% at 50% 0%,rgba(139,92,246,.1) 0%,transparent 55%),
    radial-gradient(ellipse 50% 35% at 85% 60%,rgba(6,182,212,.08) 0%,transparent 50%),
    radial-gradient(ellipse 50% 35% at 15% 80%,rgba(74,123,247,.06) 0%,transparent 50%),
    var(--bg)}
.page{display:none;animation:fade .35s ease;padding:calc(var(--safe-t) + 16px) 16px 16px}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== 顶部栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 20px}
.topbar .title{font-size:26px;font-weight:800;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-stats{display:flex;gap:14px;align-items:center}
.tb-stat{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800}
.tb-stat .ic{font-size:20px}
.tb-streak{color:var(--orange)}
.tb-xp{color:var(--yellow)}

/* ===== 进度条 ===== */
.progress-wrap{background:rgba(255,255,255,.05);border-radius:var(--radius-pill);height:8px;overflow:hidden;margin-bottom:20px;position:relative;border:1px solid var(--border)}
.progress-fill{background:var(--grad-aurora);height:100%;border-radius:var(--radius-pill);transition:width .6s ease;box-shadow:0 0 12px rgba(74,123,247,.3)}

/* ===== 卡片 ===== */
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.25),rgba(6,182,212,.25),transparent)}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-card-hover)}
.card h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}

/* ===== 按钮 ===== */
.btn{background:var(--grad-aurora);color:#fff;border-radius:var(--radius);padding:14px 20px;font-size:15px;font-weight:700;width:100%;letter-spacing:.3px;box-shadow:var(--glow-aurora);transition:all .15s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
.btn:active::after{left:100%}
.btn:active{transform:scale(.97);box-shadow:0 2px 12px rgba(139,92,246,.2)}
.btn.sec{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border-accent);box-shadow:none}
.btn.sec:active{background:rgba(255,255,255,.08)}
.btn.blue{background:var(--grad-blue);box-shadow:var(--glow-blue)}
.btn.green{background:linear-gradient(135deg,#22C55E,#16A34A);box-shadow:0 4px 16px rgba(34,197,94,.25)}
.btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 4px 16px rgba(239,68,68,.25)}
.btn.cyan{background:var(--grad-cyan);box-shadow:0 4px 16px rgba(6,182,212,.25)}
.btn:disabled{background:rgba(255,255,255,.04);color:var(--text3);box-shadow:none}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}

/* ===== 输入框 ===== */
input[type=text],input[type=number],textarea,select{
  width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;color:var(--text);margin-bottom:12px;font-weight:500;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:100px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,123,247,.12)}
input::placeholder,textarea::placeholder{color:var(--text3);font-weight:500}

/* ===== 日头部卡片 ===== */
.day-header-card{background:linear-gradient(135deg,rgba(139,92,246,.06),rgba(6,182,212,.04));border:1px solid rgba(139,92,246,.12)}
.day-header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.day-badge{background:var(--grad-aurora);color:#fff;padding:4px 12px;border-radius:var(--radius-pill);font-size:13px;font-weight:800;letter-spacing:.5px}
.day-title-text{font-size:18px;font-weight:700;color:var(--text)}

/* ===== 阅读理解 ===== */
.essay-area p{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:12px;cursor:pointer;padding:6px 10px;border-radius:8px;transition:background .15s}
.essay-area p:active{background:rgba(255,255,255,.04)}
.essay-area p:first-child{font-size:18px;font-weight:700;color:var(--cyan-light);margin-bottom:16px}
.essay-area-cn p{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:8px}
.essay-area-cn p:first-child{font-size:16px;font-weight:600;color:var(--text)}

/* ===== 底部导航 ===== */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;
  background:rgba(13,15,26,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);z-index:100}
.nav-btn{flex:1;background:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--text3);transition:color .2s;position:relative}
.nav-btn .ic{font-size:22px}
.nav-btn.active{color:var(--blue)}
.nav-btn.active::after{content:'';position:absolute;top:0;width:24px;height:2px;border-radius:2px;background:var(--grad-blue)}
.nav-btn:active{transform:scale(.9)}

/* ===== 统计卡片 ===== */
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius);padding:16px 8px;text-align:center;box-shadow:var(--shadow-card);transition:border-color .2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-card .num{font-size:20px;font-weight:800;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-card .lbl{font-size:10px;color:var(--text2);margin-top:3px;font-weight:500;letter-spacing:.5px}

/* ===== 学习模块卡片 ===== */
.module-card{display:flex;align-items:center;gap:14px;padding:16px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-card);transition:all .15s;position:relative;overflow:hidden;cursor:pointer}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-aurora);opacity:0;transition:opacity .2s}
.module-card:active{transform:scale(.97);border-color:var(--border-strong)}
.module-card:hover::before{opacity:1}
.module-card .mc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;letter-spacing:.5px}
.module-card .mc-icon.purple{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(6,182,212,.08));border:1px solid rgba(139,92,246,.3);color:#a78bfa}
.module-card .mc-icon.blue{background:linear-gradient(135deg,rgba(74,123,247,.15),rgba(91,139,247,.08));border:1px solid rgba(74,123,247,.25);color:#60a5fa}
.module-card .mc-icon.green{background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(22,163,74,.08));border:1px solid rgba(34,197,94,.25);color:#4ade80}
.module-card .mc-icon.cyan{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(34,211,238,.08));border:1px solid rgba(6,182,212,.25);color:#22d3ee}
.module-card .mc-icon.orange{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(251,191,36,.08));border:1px solid rgba(249,115,22,.25);color:#fb923c}
.module-card .mc-body{flex:1}
.module-card .mc-title{font-size:15px;font-weight:700;color:var(--text)}
.module-card .mc-sub{font-size:13px;color:var(--text2);font-weight:500;margin-top:2px}
.module-card .mc-arrow{color:var(--text3);font-size:20px}
.module-card .mc-badge{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);border-radius:var(--radius-pill);padding:2px 10px;font-size:11px;font-weight:700;flex-shrink:0}
.module-card.done{opacity:.6}
.module-card.done .mc-badge{background:rgba(74,123,247,.1);color:var(--blue);border-color:rgba(74,123,247,.2)}

/* ===== 导入区域 ===== */
.import-box{background:rgba(255,255,255,.02);border:1px dashed var(--border-accent);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px}
.import-box .ic{font-size:36px;margin-bottom:8px}
.import-box .tip{font-size:13px;color:var(--text2);font-weight:500}

/* ===== Day 选择器 ===== */
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.day-btn{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.day-btn:active{transform:scale(.95)}
.day-btn.current{background:var(--grad-blue);border-color:transparent;color:#fff;box-shadow:var(--glow-blue)}
.day-btn.done{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);color:var(--green)}
.day-btn .dn{font-size:16px;font-weight:800;display:block;margin-bottom:2px}
.day-btn .dt{font-size:11px;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.phase-title{font-size:13px;font-weight:700;color:var(--text2);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.phase-title::before{content:'';width:3px;height:14px;background:var(--grad-aurora);border-radius:2px}

/* ===== 单词卡片（翻面）===== */
.flip-card{perspective:1000px;margin:0 auto 24px;width:100%;max-width:360px;height:240px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.flip-front{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(6,182,212,.05));border:1px solid var(--border);box-shadow:var(--shadow-card)}
.flip-back{background:linear-gradient(135deg,rgba(74,123,247,.1),rgba(34,211,238,.05));border:1px solid var(--border);box-shadow:var(--shadow-card);transform:rotateY(180deg)}
.flip-front .fw{font-size:32px;font-weight:900;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.flip-front .ftip{font-size:13px;color:var(--text3);font-weight:500}
.flip-back .fm{font-size:22px;font-weight:700;color:var(--text);margin-bottom:12px}
.flip-back .fe{font-size:14px;color:var(--text2);font-style:italic;font-weight:500;line-height:1.6}
.flip-back .fet{font-size:12px;color:var(--text3);margin-top:6px;font-weight:500}

/* ===== 对话气泡 ===== */
.dialog{max-height:55vh;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;padding:4px}
.dialog::-webkit-scrollbar{width:4px}
.dialog::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.dlg-line{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;word-break:break-word;line-height:1.6;font-weight:400;position:relative}
.dlg-line.agent{background:rgba(255,255,255,.04);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start;color:var(--text)}
.dlg-line.you{background:var(--grad-blue);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;box-shadow:0 4px 12px rgba(74,123,247,.2)}
.dlg-line .role{font-size:11px;font-weight:800;opacity:.7;margin-bottom:4px;letter-spacing:.5px}
.dlg-line .cn{font-size:12px;opacity:.65;margin-top:6px;font-weight:500}
.dlg-line.active{animation:pulse-line .8s ease}
@keyframes pulse-line{0%{transform:scale(.95);opacity:.7}100%{transform:none;opacity:1}}

/* ===== Loading / Toast ===== */
#loading{display:none;position:fixed;inset:0;background:rgba(13,15,26,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--text2);font-size:15px;font-weight:600}
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(22,27,34,.95);backdrop-filter:blur(12px);color:var(--text);padding:13px 22px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:998;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center;border:1px solid var(--border-accent);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-color:rgba(239,68,68,.4);color:var(--red)}
.toast.success{border-color:rgba(34,197,94,.4);color:var(--green)}

/* ===== 工具类 ===== */
.row{display:flex;gap:10px;align-items:center}
.row .btn{flex:1}
.mt8{margin-top:8px}.mb8{margin-bottom:8px}.mt16{margin-top:16px}.mb16{margin-bottom:16px}
.muted{color:var(--text2);font-size:13px;font-weight:500}
.label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.tag{display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 12px;font-size:12px;font-weight:600;margin:2px;color:var(--text2)}
.tag.blue{background:rgba(74,123,247,.1);border-color:rgba(74,123,247,.2);color:var(--blue)}
.tag.green{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.2);color:var(--green)}
.tag.orange{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.2);color:var(--orange)}
.tag.purple{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.2);color:var(--purple)}
.hidden{display:none!important}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.center{text-align:center}
.word-progress{font-size:14px;font-weight:700;color:var(--text2);text-align:center;margin-bottom:16px}

/* ===== 柱状图 ===== */
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.bar{flex:1;background:var(--grad-blue);border-radius:6px 6px 0 0;min-height:4px;position:relative;transition:height .5s;opacity:.85}
.bar:hover{opacity:1}
.bar .bl{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--text2);font-weight:500}
</style>
</head>
<body>
<div id="app">

<!-- ============ 首页 ============ -->
<div class="page active" id="page-home">
  <div class="topbar">
    <div class="title">旅行英语</div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="daily-progress" style="width:0%"></div></div>

  <!-- 未导入时显示导入 -->
  <div id="no-plan-card" class="card">
    <h3>导入学习计划</h3>
    <div class="import-box">
      <div class="ic">📥</div>
      <div class="tip">从 WorkBuddy 复制学习内容粘贴到下方</div>
    </div>
    <textarea id="plan-input" placeholder="打开 WorkBuddy 学习页面 → 全选复制 → 粘贴到这里..." style="min-height:100px;margin-bottom:8px"></textarea>
    <button class="btn" onclick="importPlan()">导入计划</button>
    <div class="muted mt8" style="text-align:center;font-size:12px">支持导入 Day 详情页或索引页内容</div>
  </div>

  <!-- 已导入后显示今日学习 -->
  <div id="has-plan-card" class="hidden">
    <div class="card day-header-card">
      <div class="day-header-top">
        <span class="day-badge" id="today-day-num">Day 1</span>
        <span class="day-title-text" id="today-day-title">今日学习</span>
      </div>
      <div id="today-desc" class="muted mb8"></div>
      <div id="today-stats" class="stats-row"></div>
    </div>

    <div id="module-list"></div>

    <div class="card">
      <h3>学习日历</h3>
      <div id="day-grid-area"></div>
    </div>
  </div>
</div>

<!-- ============ 单词学习页 ============ -->
<div class="page" id="page-words">
  <div class="topbar">
    <div class="title" id="word-page-title">单词学习</div>
    <button class="btn sm sec" onclick="nav('home')">返回</button>
  </div>
  <div class="word-progress" id="word-progress"></div>
  <div class="flip-card" id="flip-card" onclick="flipCard()">
    <div class="flip-inner">
      <div class="flip-front">
        <div class="fw" id="fc-word">loading...</div>
        <div class="ftip">点击卡片查看释义</div>
      </div>
      <div class="flip-back">
        <div class="fm" id="fc-meaning">...</div>
        <div class="fe" id="fc-example">...</div>
        <div class="fet" id="fc-example-cn">...</div>
      </div>

<script>
/* ============================================================
 * 旅行英语学习助手 - WorkBuddy 计划驱动
 * ============================================================ */

/* ===== 存储 ===== */
const Store = {
  get(k, def) { try { const v = localStorage.getItem('wb_' + k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem('wb_' + k, JSON.stringify(v)); }
};

/* ===== 全局状态 ===== */
let wordList = [], wordIdx = 0, wordType = 'new'; // new / review
let dlgLines = [], dlgRole = 'all';

/* ===== 导航 ===== */
function nav(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const map = {home:'nav-home',stats:'nav-stats'};
  document.getElementById(map[page] || 'nav-home')?.classList.add('active');
  window.scrollTo(0, 0);
  if (page === 'home') renderHome();
  if (page === 'stats') renderStats();
}

/* ===== Toast / Loading ===== */
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2800);
}
function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }

/* ===== 语音 ===== */
function speak(text, rate) {
  if (!window.speechSynthesis) { toast('浏览器不支持语音', 'error'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || 0.9;
  speechSynthesis.speak(u);
}

/* ===== 日期工具 ===== */
function todayKey() { return new Date().toISOString().slice(0, 10); }
function addXP(xp) {
  Store.set('totalXP', Store.get('totalXP', 0) + xp);
  const log = Store.get('xpLog', {});
  const t = todayKey();
  log[t] = (log[t] || 0) + xp;
  Store.set('xpLog', log);
  updateStreak();
}
function updateStreak() {
  const t = todayKey();
  const last = Store.get('lastDate', '');
  if (last !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    Store.set('streak', last === y ? Store.get('streak', 0) + 1 : 1);
    Store.set('lastDate', t);
  }
}
function updateTopbar() {
  const progress = calcDayProgress();
  document.getElementById('daily-progress').style.width = progress + '%';
}
function calcDayProgress() {
  const currentDay = Store.get('currentDay', 1);
  const days = Store.get('days', {});
  const dayData = days[currentDay] || {};
  const progress = Store.get('dayProgress', {});
  const dp = progress[currentDay] || { newWords: false, review: false, dialog: false, essay: false };

  // 根据实际有内容的模块计算总数
  let total = 0, done = 0;
  if ((dayData.newWords || []).length > 0) { total++; if (dp.newWords) done++; }
  if ((dayData.reviewWords || []).length > 0) { total++; if (dp.review) done++; }
  if ((dayData.dialog || []).length > 0) { total++; if (dp.dialog) done++; }
  if ((dayData.essay?.en || []).length > 0) { total++; if (dp.essay) done++; }
  return total > 0 ? Math.round((done / total) * 100) : 0;
}
function markModuleDone(mod) {
  const currentDay = Store.get('currentDay', 1);
  const progress = Store.get('dayProgress', {});
  if (!progress[currentDay]) progress[currentDay] = { newWords: false, review: false, dialog: false, essay: false };
  progress[currentDay][mod] = true;
  Store.set('dayProgress', progress);
  addXP(30);
  toast('完成！+30 XP', 'success');
  updateTopbar();
  renderHome();
}

/* ===== 阅读理解 ===== */
let essayLines = [];
let essayCnLines = [];

function startEssay() {
  const days = Store.get('days', {});
  const currentDay = Store.get('currentDay', 1);
  const dayData = days[currentDay] || {};
  essayLines = dayData.essay?.en || [];
  essayCnLines = dayData.essay?.cn || [];

  document.getElementById('essay-en').innerHTML = essayLines.map((line, i) =>
    `<p class="essay-line" onclick="speakEssayLine(${i})">${line}</p>`
  ).join('');

  document.getElementById('essay-cn').innerHTML = essayCnLines.map(line =>
    `<p class="essay-line-cn">${line}</p>`
  ).join('');

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-essay').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
}

function speakEssay() {
  const text = essayLines.join('. ');
  speak(text, 0.85);
  toast('朗读中...', 'success');
}

function speakEssayLine(idx) {
  if (essayLines[idx]) {
    speak(essayLines[idx], 0.8);
  }
}

function markEssayDone() {
  markModuleDone('essay');
  nav('home');
}

/* ===== 首页渲染 ===== */
function renderHome() {
  updateTopbar();
  const days = Store.get('days', {});
  const hasPlan = Object.keys(days).length > 0;

  document.getElementById('no-plan-card').classList.toggle('hidden', hasPlan);
  document.getElementById('has-plan-card').classList.toggle('hidden', !hasPlan);

  if (!hasPlan) return;

  const currentDay = Store.get('currentDay', 1);
  const dayData = days[currentDay] || { title: 'Day ' + currentDay, desc: '', newWords: [], reviewWords: [], dialog: [], essay: { en: [], cn: [] } };
  const progress = Store.get('dayProgress', {})[currentDay] || {};

  document.getElementById('today-day-num').textContent = 'Day ' + currentDay;
  document.getElementById('today-day-title').textContent = dayData.title ? dayData.title.replace(/Day\s*\d+\s*[·•\-:：\s]*/, '') : '';
  document.getElementById('today-desc').textContent = dayData.desc || '';

  // 统计
  const newCount = (dayData.newWords || []).length;
  const reviewCount = (dayData.reviewWords || []).length;
  const dlgCount = (dayData.dialog || []).filter(l => l.role === 'agent' || l.role === 'you').length;
  const essayCount = (dayData.essay?.en || []).length;
  document.getElementById('today-stats').innerHTML = `
    <div class="stat-card"><div class="num">${newCount}</div><div class="lbl">新词</div></div>
    <div class="stat-card"><div class="num">${reviewCount}</div><div class="lbl">复习</div></div>
    <div class="stat-card"><div class="num">${dlgCount}</div><div class="lbl">对话</div></div>
    <div class="stat-card"><div class="num">${essayCount}</div><div class="lbl">阅读</div></div>`;

  // 学习模块 - 只显示有内容的模块
  const modules = [];
  if (newCount > 0) {
    modules.push({ key: 'newWords', icon: '词汇', title: '今日新词', sub: newCount + ' 个新单词', color: 'purple', badge: progress.newWords ? '已完成' : (newCount + '词'), done: progress.newWords, action: 'startWordStudy("new")' });
  }
  if (reviewCount > 0) {
    modules.push({ key: 'review', icon: '复习', title: '艾宾浩斯复习', sub: reviewCount + ' 个复习单词', color: 'blue', badge: progress.review ? '已完成' : (reviewCount + '词'), done: progress.review, action: 'startWordStudy("review")' });
  }
  if (dlgCount > 0) {
    modules.push({ key: 'dialog', icon: '对话', title: '口语对话练习', sub: dlgCount + ' 句对话', color: 'green', badge: progress.dialog ? '已完成' : (dlgCount + '句'), done: progress.dialog, action: 'startDialog()' });
  }
  if (essayCount > 0) {
    modules.push({ key: 'essay', icon: '阅读', title: '阅读理解', sub: essayCount + ' 段短文', color: 'cyan', badge: progress.essay ? '已完成' : '阅读', done: progress.essay, action: 'startEssay()' });
  }

  if (modules.length === 0) {
    document.getElementById('module-list').innerHTML = '<div class="card"><div class="muted" style="text-align:center;padding:20px 0">这一天暂无学习内容</div></div>';
  } else {
    document.getElementById('module-list').innerHTML = modules.map(m =>
      `<div class="module-card ${m.done ? 'done' : ''}" onclick="${m.action}">
        <div class="mc-icon ${m.color}">${m.icon}</div>
        <div class="mc-body"><div class="mc-title">${m.title}</div><div class="mc-sub">${m.sub}</div></div>
        <div class="mc-badge">${m.badge}</div>
      </div>`
    ).join('');
  }

  // Day 选择器
  renderDayGrid();

  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderDayGrid() {
  const days = Store.get('days', {});
  const dayList = Object.keys(days).map(Number).sort((a, b) => a - b);
  const currentDay = Store.get('currentDay', 1);
  const progress = Store.get('dayProgress', {});

  // 分组
  const phase1 = dayList.filter(d => d <= 20);
  const phase2 = dayList.filter(d => d > 20);

  function renderGroup(list, title) {
    if (!list.length) return '';
    return `<div class="phase-title">${title}</div><div class="day-grid">` + list.map(d => {
      const done = progress[d] && Object.values(progress[d]).every(Boolean);
      const isCurrent = d === currentDay;
      const dt = days[d]?.title?.replace(/Day\s*\d+\s*[·•\-:：\s]*/, '') || '';
      return `<div class="day-btn ${isCurrent ? 'current' : ''} ${done ? 'done' : ''}" onclick="selectDay(${d})">
        <span class="dn">Day ${d}</span>
        <span class="dt">${dt}</span>
      </div>`;
    }).join('') + '</div>';
  }

  let html = '';
  if (phase2.length > 0) {
    html += renderGroup(phase1, 'PHASE 1 · 生存基础 (Day 1-20)');
    html += renderGroup(phase2, 'PHASE 2 · 日常交流进阶 (Day 21-40)');
  } else {
    html += renderGroup(phase1, '学习日程');
  }

  document.getElementById('day-grid-area').innerHTML = html;
}

function selectDay(d) {
  Store.set('currentDay', d);
  renderHome();
  toast('已切换到 Day ' + d, 'success');
}

/* ===== 导入解析 ===== */
function importPlan() {
  const txt = document.getElementById('plan-input').value.trim();
  if (!txt) { toast('请粘贴学习内容', 'error'); return; }
  const result = parseWorkBuddy(txt);
  if (!result) { toast('未能识别内容，请确保复制完整', 'error'); return; }

  // 保存数据
  const days = Store.get('days', {});
  Object.assign(days, result.days);
  Store.set('days', days);

  // 设置当前 Day
  if (result.currentDay && !Store.get('currentDay')) {
    Store.set('currentDay', result.currentDay);
  } else if (!Store.get('currentDay')) {
    const firstDay = Math.min(...Object.keys(days).map(Number));
    Store.set('currentDay', firstDay);
  }

  // 统计单词总数
  let totalWords = 0;
  for (const d in days) {
    totalWords += (days[d].newWords || []).length;
    totalWords += (days[d].reviewWords || []).length;
  }

  const dayCount = Object.keys(days).length;
  toast(`导入成功！${dayCount}天计划，${totalWords}个单词`, 'success');
  document.getElementById('plan-input').value = '';
  renderHome();
}

function reimportPlan() {
  const txt = document.getElementById('reimport-input').value.trim();
  if (!txt) { toast('请粘贴学习内容', 'error'); return; }
  if (!confirm('重新导入会覆盖当前学习数据，确定继续吗？')) return;
  const result = parseWorkBuddy(txt);
  if (!result) { toast('未能识别内容', 'error'); return; }
  Store.set('days', result.days);
  if (result.currentDay) Store.set('currentDay', result.currentDay);
  Store.set('dayProgress', {});
  toast('重新导入成功！', 'success');
  document.getElementById('reimport-input').value = '';
  nav('home');
}

/* ===== WorkBuddy 解析器 ===== */
function parseWorkBuddy(txt) {
  const days = {};
  let currentDay = null;

  // 清理文本
  txt = txt.replace(/\r/g, '\n').replace(/\n{3,}/g, '\n\n').trim();

  // 判断是否为索引页（有很多 Day 条目但没有单词详情）
  const dayMatches = [...txt.matchAll(/Day\s*(\d+)\s+([^\n]+)/gi)];

  // 如果是 Day 详情页，检测 Day 标题
  const dayTitleMatch = txt.match(/DAY\s*(\d+)[\s\S]*?\n([^\n]+)(?:\n|$)/i);
  const dayTitleMatch2 = txt.match(/Day\s*(\d+)\s*[·•\-:：]\s*([^\n]+)/i);

  if (dayTitleMatch || dayTitleMatch2) {
    const m = dayTitleMatch || dayTitleMatch2;
    const dayNum = parseInt(m[1]);
    const dayTitle = m[2]?.trim() || '';

    const dayData = {
      title: `Day ${dayNum} · ${dayTitle}`,
      desc: '',
      newWords: [],
      reviewWords: [],
      dialog: []
    };

    // 提取描述（在标题和"今日新词"之间）
    const descMatch = txt.match(/DAY\s*\d+[\s\S]*?\n[^\n]+\n([\s\S]*?)(今日新词|新\s*词|今日)/i);
    if (descMatch) {
      dayData.desc = descMatch[1].trim().split('\n').filter(l => l.trim() && !/^\d+/.test(l) && !/新\s*词|复\s*习|对\s*话|累\s*计|场\s*景/i.test(l)).join(' ').slice(0, 100);
    }

    // 提取新词区
    const newSection = extractSection(txt, ['今日新词', '新词', 'NEW', '今日新', '16-30']);
    if (newSection) {
      dayData.newWords = extractWords(newSection);
    }

    // 提取复习区
    const reviewSection = extractSection(txt, ['艾宾浩斯复习', '复习', 'REVIEW', '今日复习', 'review']);
    if (reviewSection) {
      dayData.reviewWords = extractWords(reviewSection);
    }

    // 如果没找到明确的新词/复习分区，尝试提取所有单词作为新词
    if (dayData.newWords.length === 0 && dayData.reviewWords.length === 0) {
      dayData.newWords = extractWords(txt);
    }

    // 提取对话
    const dialogSection = extractSection(txt, ['今日口语练习', '口语练习', '对话练习', 'DIALOG', '场景对话', '口语']);
    if (dialogSection) {
      dayData.dialog = extractDialog(dialogSection);
    }

    if (dayData.newWords.length > 0 || dayData.reviewWords.length > 0 || dayData.dialog.length > 0) {
      days[dayNum] = dayData;
      currentDay = dayNum;
    }
  }

  // 如果没解析到天数据，尝试从纯文本中提取所有单词
  if (Object.keys(days).length === 0) {
    const words = extractWords(txt);
    const dialog = extractDialog(txt);
    if (words.length > 0 || dialog.length > 0) {
      days[1] = {
        title: 'Day 1 · 学习计划',
        desc: '导入的学习内容',
        newWords: words.slice(0, Math.ceil(words.length / 2)),
        reviewWords: words.slice(Math.ceil(words.length / 2)),
        dialog: dialog
      };
      currentDay = 1;
    }
  }

  if (Object.keys(days).length === 0) return null;
  return { days, currentDay };
}

function extractSection(text, keywords) {
  for (const kw of keywords) {
    const idx = text.indexOf(kw);
    if (idx >= 0) {
      // 从关键词位置开始，到下一个大标题结束
      const rest = text.slice(idx + kw.length);
      // 找下一个可能的章节标题
      const nextHeaders = ['今日新词', '今日复习', '艾宾浩斯复习', '今日口语练习', '练习提示：', '练习提示 ', 'PHASE 1', 'PHASE 2'];
      let endIdx = rest.length;
      for (const nh of nextHeaders) {
        if (nh === kw) continue;
        const ni = rest.indexOf(nh);
        if (ni > 0 && ni < endIdx) endIdx = ni;
      }
      return rest.slice(0, endIdx);
    }
  }
  return null;
}

function extractWords(text) {
  const words = [];
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 跳过纯数字、标题行
    if (/^\d+$/.test(line)) { i++; continue; }
    if (/今日|新词|复习|口语|对话|练习|场景|PHASE|累计|新\s*词|复\s*习/.test(line) && line.length < 20) { i++; continue; }

    // 匹配单词行：英文词 + 中文释义
    // 格式1: check-in counter\n值机柜台\n│ Check-in counters are...\n 值机柜台位于二楼。
    // 格式2: boarding pass 登机牌
    // 格式3: 16 check-in counter 值机柜台

    // 先找独立的英文行（以英文开头，没有中文）
    const enWordMatch = line.match(/^([a-zA-Z][a-zA-Z\s\-\'\/]*[a-zA-Z])$/);
    if (enWordMatch && enWordMatch[1].length <= 50 && enWordMatch[1].length >= 2) {
      const word = enWordMatch[1].trim();
      let meaning = '';
      let exampleEn = '';
      let exampleCn = '';

      // 下一行可能是中文释义
      if (i + 1 < lines.length) {
        const nextLine = lines[i + 1];
        if (/^[\u4e00-\u9fa5]/.test(nextLine) && nextLine.length < 30) {
          meaning = nextLine;
          i++;

          // 再下一行可能是例句（以 │ 或 | 开头）
          if (i + 1 < lines.length) {
            const exLine = lines[i + 1];
            const exMatch = exLine.match(/^[│|｜]\s*(.+)$/);
            if (exMatch) {
              exampleEn = exMatch[1].trim();
              i++;

              // 再下一行可能是中文翻译
              if (i + 1 < lines.length) {
                const exCnLine = lines[i + 1];
                if (/^[\u4e00-\u9fa5]/.test(exCnLine) && exCnLine.length > 5) {
                  exampleCn = exCnLine;
                  i++;
                }
              }
            }
          }
        }
      }

      if (word && meaning) {
        words.push({ word, meaning, example: exampleEn, exampleCn });
      }
      i++;
      continue;
    }

    // 格式："16 check-in counter 值机柜台" 或 "boarding pass 登机牌"
    const inlineMatch = line.match(/^(?:\d+\s+)?([a-zA-Z][a-zA-Z\s\-\'\/]{1,40}[a-zA-Z])\s+([\u4e00-\u9fa5][^\n]{2,30})$/);
    if (inlineMatch) {
      words.push({
        word: inlineMatch[1].trim(),
        meaning: inlineMatch[2].trim(),
        example: '',
        exampleCn: ''
      });
      i++;
      continue;
    }

    i++;
  }

  // 去重
  const seen = new Set();
  return words.filter(w => {
    const key = w.word.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function extractDialog(text) {
  const lines = [];
  const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);

  // 提取场景描述
  const sceneMatch = text.match(/场\s*景[：:]\s*([^\n]+)/);
  let scene = sceneMatch ? sceneMatch[1].trim() : '';

  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];

    // 匹配 AGENT / YOU 对话
    const roleMatch = line.match(/^(AGENT|YOU|Agent|You|服务员|旅客|前台|店员|顾客)\s*[：:]\s*(.+)$/);
    if (roleMatch) {
      const role = roleMatch[1].toUpperCase();
      const en = roleMatch[2].trim();
      let cn = '';

      // 下一行可能是中文翻译
      if (i + 1 < rawLines.length) {
        const next = rawLines[i + 1];
        if (/^[\u4e00-\u9fa5]/.test(next) && next.length > 3 && !/^(AGENT|YOU|Agent|You)/.test(next)) {
          cn = next;
          i++;
        }
      }

      lines.push({
        role: role === 'YOU' ? 'you' : 'agent',
        roleLabel: role === 'YOU' ? 'YOU' : 'AGENT',
        en, cn
      });
    }
  }

  // 如果有场景信息，加到第一行
  if (scene && lines.length > 0) {
    lines.unshift({ role: 'scene', roleLabel: '场景', en: scene, cn: scene });
  }

  return lines;
}

/* ===== 单词学习 ===== */
function startWordStudy(type) {
  wordType = type;
  const currentDay = Store.get('currentDay', 1);
  const days = Store.get('days', {});
  const dayData = days[currentDay] || { newWords: [], reviewWords: [] };

  wordList = type === 'new' ? (dayData.newWords || []) : (dayData.reviewWords || []);
  if (!wordList.length) { toast('没有' + (type === 'new' ? '新' : '复习') + '单词', 'error'); return; }

  wordIdx = 0;
  document.getElementById('word-page-title').textContent = type === 'new' ? '今日新词' : '艾宾浩斯复习';
  showWord();

  // 切换到单词页
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-words').classList.add('active');
  window.scrollTo(0, 0);
}

function showWord() {
  if (wordIdx >= wordList.length) {
    toast('🎉 完成！', 'success');
    markModuleDone(wordType === 'new' ? 'newWords' : 'review');
    nav('home');
    return;
  }
  const w = wordList[wordIdx];
  document.getElementById('fc-word').textContent = w.word;
  document.getElementById('fc-meaning').textContent = w.meaning;
  document.getElementById('fc-example').textContent = w.example || '';
  document.getElementById('fc-example-cn').textContent = w.exampleCn || '';
  document.getElementById('word-progress').textContent = `${wordIdx + 1} / ${wordList.length}`;
  document.getElementById('flip-card').classList.remove('flipped');
}

function flipCard() {
  document.getElementById('flip-card').classList.toggle('flipped');
}

function speakWord() {
  if (wordList[wordIdx]) speak(wordList[wordIdx].word, 0.9);
}
function speakWordSlow() {
  if (wordList[wordIdx]) speak(wordList[wordIdx].word, 0.6);
}

function wordAnswer(correct) {
  if (correct) addXP(5);
  wordIdx++;
  showWord();
}

/* ===== 对话练习 ===== */
function startDialog() {
  const currentDay = Store.get('currentDay', 1);
  const days = Store.get('days', {});
  const dayData = days[currentDay] || { dialog: [], title: '' };

  dlgLines = dayData.dialog || [];
  if (!dlgLines.length) { toast('没有对话内容', 'error'); return; }

  document.getElementById('dlg-title').textContent = '对话练习';
  const sceneLine = dlgLines.find(l => l.role === 'scene');
  document.getElementById('dlg-scene').textContent = sceneLine ? ('场景：' + sceneLine.en) : '';

  renderDialog();

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-dialog').classList.add('active');
  window.scrollTo(0, 0);
}

function renderDialog() {
  const area = document.getElementById('dialog-area');
  area.innerHTML = dlgLines.filter(l => l.role !== 'scene').map((l, i) =>
    `<div class="dlg-line ${l.role}" onclick="speak('${l.en.replace(/'/g, "\\'")}')">
      <div class="role">${l.roleLabel}</div>
      <div>${l.en}</div>
      ${l.cn ? `<div class="cn">${l.cn}</div>` : ''}
    </div>`
  ).join('');
}

let playTimer = null;
function playAllDialog() {
  const lines = dlgLines.filter(l => l.role !== 'scene');
  let i = 0;
  const bubbles = document.querySelectorAll('.dlg-line');

  function playNext() {
    if (i >= lines.length) return;
    bubbles.forEach(b => b.classList.remove('active'));
    bubbles[i]?.classList.add('active');
    bubbles[i]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    speak(lines[i].en, 0.85);
    i++;
    playTimer = setTimeout(playNext, 3500);
  }
  playNext();
}

function rolePlayMode() {
  toast('角色扮演：YOU 的台词留给你说', 'success');
  const lines = dlgLines.filter(l => l.role !== 'scene');
  let i = 0;
  const bubbles = document.querySelectorAll('.dlg-line');

  function playNext() {
    if (i >= lines.length) { toast('对话结束！', 'success'); markModuleDone('dialog'); return; }
    bubbles.forEach(b => b.classList.remove('active'));
    bubbles[i]?.classList.add('active');
    bubbles[i]?.scrollIntoView({ behavior: 'smooth', block: 'center' });

    if (lines[i].role === 'agent') {
      speak(lines[i].en, 0.85);
      i++;
      playTimer = setTimeout(playNext, 4000);
    } else {
      // YOU 的台词，停顿更久让用户说
      i++;
      playTimer = setTimeout(playNext, 6000);
    }
  }
  playNext();
}

/* ===== 统计页 ===== */
function renderStats() {
  document.getElementById('set-goal').value = Store.get('goal', 100);

  const xpLog = Store.get('xpLog', {});
  const totalXP = Store.get('totalXP', 0);
  const streak = Store.get('streak', 0);
  const days = Store.get('days', {});
  const progress = Store.get('dayProgress', {});

  let daysDone = 0;
  let totalWords = 0;
  for (const d in days) {
    totalWords += (days[d].newWords || []).length;
    totalWords += (days[d].reviewWords || []).length;
    const dp = progress[d];
    if (dp && dp.newWords && dp.review && dp.dialog) daysDone++;
  }

  document.getElementById('pf-stats').innerHTML = `
    <div class="stat-card"><div class="num">${streak}</div><div class="lbl">连续天数</div></div>
    <div class="stat-card"><div class="num">${totalXP}</div><div class="lbl">总XP</div></div>
    <div class="stat-card"><div class="num">${totalWords}</div><div class="lbl">单词总数</div></div>`;

  // 柱状图 - 近7天 XP
  const chartDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5);
    const key = d.toISOString().slice(0, 10);
    chartDays.push({ key, xp: xpLog[key] || 0, label: (d.getMonth() + 1) + '/' + d.getDate() });
  }
  const maxXP = Math.max(...chartDays.map(d => d.xp), 10);
  document.getElementById('pf-chart').innerHTML = chartDays.map(d =>
    `<div class="bar" style="height:${(d.xp / maxXP) * 100}%" title="${d.xp} XP"><span class="bl">${d.label}</span></div>`
  ).join('');
}

function saveSettings(btn) {
  Store.set('goal', parseInt(document.getElementById('set-goal').value) || 100);
  if (btn) btn.textContent = '已保存！';
  const msg = document.getElementById('save-msg');
  if (msg) msg.classList.remove('hidden');
  setTimeout(() => {
    if (btn) btn.textContent = '保存设置';
    if (msg) msg.classList.add('hidden');
  }, 2500);
  updateTopbar();
}

function clearData() {
  if (!confirm('确定清除所有数据？此操作不可恢复！')) return;
  Object.keys(localStorage).filter(k => k.startsWith('wb_')).forEach(k => localStorage.removeItem(k));
  toast('数据已清除', 'success');
  setTimeout(() => location.reload(), 800);
}

. It depends on your budget and interests.", "speaker": "AGENT"}, {"role": "you", "en": "I want to explore local culture and try authentic food.", "speaker": "YOU"}, {"role": "agent", "en": "Then Japan is a great choice. The food there is amazing.", "speaker": "AGENT"}, {"role": "you", "en": "Is it expensive?", "speaker": "YOU"}, {"role": "agent", "en": "It can be, but there are reasonable options if you plan ahead.", "speaker": "AGENT"}, {"role": "you", "en": "What about the peak season? Should I avoid it?", "speaker": "YOU"}, {"role": "agent", "en": "Yes, I suggest the off-season. It's less crowded and more worthwhile.", "speaker": "AGENT"}, {"role": "you", "en": "Can you help me plan an itinerary?", "speaker": "YOU"}, {"role": "agent", "en": "Of course. Here's a guidebook with some must-see places.", "speaker": "AGENT"}, {"role": "you", "en": "Are there any alternatives to the popular spots?", "speaker": "YOU"}, {"role": "agent", "en": "Yes, I can suggest some hidden gems that most tourists miss.", "speaker": "AGENT"}, {"role": "you", "en": "That sounds perfect. Let's book it.", "speaker": "YOU"}], "essay": {"en": ["Choosing a Destination", "When planning a trip, the first step is choosing your destination.", "Some travelers prefer popular spots during peak season.", "Others choose the off-season to avoid large crowds.", "A good guidebook can help you explore local culture.", "It is always worthwhile to try authentic food.", "Before you decide, compare different options carefully.", "A reasonable budget will make your trip more enjoyable.", "Sometimes an alternative route leads to the best memories."], "cn": ["选择目的地", "计划旅行时第一步是选择目的地。", "有些旅行者喜欢在旺季去热门景点。", "另一些人选择淡季以避免拥挤的人群。", "一本好的旅行指南能帮你探索当地文化。", "尝试地道的美食总是值得的。", "做决定之前仔细比较不同选项。", "合理的预算会让你的旅行更愉快。", "有时一条替代路线会带来最好的回忆。"]}}, "28": {"day": 28, "title": "旅行交通方式与预订确认", "phase": "PHASE 2", "newWords": [], "reviewWords": [], "dialog": [{"role": "agent", "en": "Good morning! Are you looking for a flight or another type justed the thermostat to make the room warmer.", "Later, I sent some shirts for laundry service.", "The amenities in the bathroom included soft towels and soap.", "I felt relaxed and ready for a good night's sleep.", "A good hotel makes travel so much more enjoyable."], "cn": ["舒适的酒店住宿", "入住酒店后，我想让房间更舒适一些。", "我打电话给前台，要了一个额外的枕头和毯子。", "客房服务在十五分钟内就送来了。", "我在衣柜里找到了保险箱，把护照锁了进去。", "迷你吧里有些零食，但我用电热水壶泡了茶。", "阳台上有绝佳的海景视野。", "我调了调温控器，让房间暖和一些。", "后来，我送了几件衬衫去洗衣服务。", "浴室里的便利设施包括柔软的毛巾和肥皂。", "我感到放松，准备好美美睡一觉了。", "一家好酒店让旅行更加愉快。"]}}, "31": {"day": 31, "title": "处理问题与投诉", "phase": "PHASE 2", "newWords": [], "reviewWords": [], "dialog": [{"role": "you", "en": "Excuse me, I have a complaint about my room.", "speaker": "YOU"}, {"role": "you", "en": "I'm sorry to hear that. What is the issue?", "speaker": "DESK"}, {"role": "you", "en": "The air conditioner is faulty and the room is too hot.", "speaker": "YOU"}, {"role": "you", "en": "I apologize for the inconvenience. We'll send someone to fix it.", "speaker": "DESK"}, {"role": "you", "en": "Also, there's a leak in the bathroom and the floor is dirty and wet.", "speaker": "YOU"}, {"role": "you", "en": "That's unacceptable. I'll arrange a room change for you right away.", "speaker": "DESK"}, {"role": "you", "en": "Can I get a refund for tonight since the room was not in good condition?", "speaker": "YOU"}, {"role": "you", "en": "I understand. Let me call the manager to resolve this.", "speaker": "DESK"}, {"role": "you", "en": "The noise from the street is also very loud. I couldn't sleep at all.", "speaker": "YOU"}, {"role": "you", "en": "We can replace your room with one on a higher floor. The view is better too.", "speaker": "DESK"}, {"role": "you", "en": "That sounds good. I hope this can be resolved quickly.", "speaker": "YOU"}, {"role": "you", "en": "Absolutely. We'll move you to a clean suite immediately.", "speaker": "DESK"}, {"role": "you", "en": "What about the broken lamp by the bed?", "speaker": "YOU"}, {"role": "you", "en": "Hou function loadBuiltInData() {
  const days = {};
  for (const key in WORKBUDDY_DATA) {
    const d = WORKBUDDY_DATA[key];
    days[key] = {
      title: d.title ? `Day ${d.day} · ${d.title}` : `Day ${d.day}`,
      desc: d.title || '',
      newWords: d.newWords || [],
      reviewWords: d.reviewWords || [],
      dialog: d.dialog || [],
      essay: d.essay || { en: [], cn: [] }
    };
  }
  return days;
}

/* ===== 初始化 ===== */
function init() {
  setupPWA();

  // 自动加载内置 WorkBuddy 数据（如果 localStorage 中没有）
  const storedDays = Store.get('days', {});
  if (Object.keys(storedDays).length === 0) {
    const builtInDays = loadBuiltInData();
    Store.set('days', builtInDays);
    Store.set('currentDay', '1');
    console.log('Loaded built-in WorkBuddy data: 38 days');
  }

  renderHome();

  // 防止 iOS 双击缩放
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
}
init();
</script>
